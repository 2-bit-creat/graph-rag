AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Graph RAG FastAPI backend with safe Lambda deployments

# S3CrudPolicy expands the parameterized bucket name into a nested Fn::Sub;
# cfn-lint W1031 cannot resolve that macro-generated ARN, although CloudFormation
# resolves it correctly at deployment time.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1031

Parameters:
  AppSecretName:
    Type: String
    Default: graph-rag/prod/app
    Description: Secrets Manager JSON secret containing DATABASE_URL, OPENAI_API_KEY, and JWT_SECRET.
  AppVersion:
    Type: String
    Default: unknown
    Description: Non-secret Git commit SHA shown by /ready.
  EnableCanary:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable after the first alias-creation deployment.
  EnableReminders:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Nightly push reminders. Turn on once VAPID keys are in Secrets Manager.
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, development]
  CorsOrigins:
    Type: String
    Default: ""
  S3Bucket:
    Type: String
    Default: ""
  MediaBaseUrl:
    Type: String
    Default: ""
  # Plain Parameters, not a secretsmanager dynamic reference like DATABASE_URL
  # above: {{resolve:secretsmanager:...:SecretString:VAPID_PUBLIC_KEY}} fails
  # CloudFormation's stack update HARD if that JSON key is absent from the
  # secret, and it does not exist yet — that took production deploys down
  # once already. Defaulting to "" here keeps deploys unblocked; app/push.py
  # already treats empty keys as "push disabled". Once real VAPID keys are
  # generated, either pass them via --parameter-overrides, or add the two
  # JSON keys to the existing secret and switch these back to
  # {{resolve:secretsmanager:...}} to match the other three.
  VapidPublicKey:
    Type: String
    Default: ""
    NoEcho: false
  VapidPrivateKey:
    Type: String
    Default: ""
    NoEcho: true
  DbRequireSsl:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  DbDisablePreparedCache:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  DbLambdaPooling:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Timeout: 120
    MemorySize: 2048
    Architectures: [x86_64]

Resources:
  GraphRagFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./backend
      DockerTag: latest
    Properties:
      PackageType: Image
      AutoPublishAlias: live
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
        # Textract has no resource-level permissions for DetectDocumentText, so
        # "*" is the only grantable resource. Scoped to the single read-only
        # synchronous action — no async jobs, no analysis APIs.
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: textract:DetectDocumentText
              Resource: "*"
      Environment:
        Variables:
          # Dynamic references keep secret values out of source, SAM config,
          # GitHub Actions, and CloudFormation event output.
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${AppSecretName}:SecretString:DATABASE_URL}}'
          OPENAI_API_KEY: !Sub '{{resolve:secretsmanager:${AppSecretName}:SecretString:OPENAI_API_KEY}}'
          JWT_SECRET: !Sub '{{resolve:secretsmanager:${AppSecretName}:SecretString:JWT_SECRET}}'
          # Web Push. Absent keys disable push rather than breaking the app —
          # see app/push.py:push_enabled. See the Parameters block above for
          # why these are plain parameters rather than a secretsmanager ref.
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          APP_VERSION: !Ref AppVersion
          CORS_ORIGINS: !Ref CorsOrigins
          ENVIRONMENT: !Ref Environment
          S3_BUCKET: !Ref S3Bucket
          MEDIA_BASE_URL: !Ref MediaBaseUrl
          DB_REQUIRE_SSL: !Ref DbRequireSsl
          DB_DISABLE_PREPARED_CACHE: !Ref DbDisablePreparedCache
          DB_LAMBDA_POOLING: !Ref DbLambdaPooling
          # Deployments invoke migrations explicitly before traffic moves.
          RUN_DB_MIGRATIONS: "false"
      FunctionUrlConfig:
        AuthType: NONE
      DeploymentPreference:
        Enabled: !Equals [!Ref EnableCanary, "true"]
        Type: Canary10Percent5Minutes
        Role: !GetAtt GraphRagCodeDeployServiceRole.Arn
        Alarms:
          - !Ref LambdaErrorsAlarm
          - !Ref LambdaThrottlesAlarm
          - !Ref LambdaDurationAlarm
        Hooks:
          PreTraffic: !Ref DeploymentValidationHook
      Events:
        # Nightly review reminder. 22:00 KST = 13:00 UTC — late enough that the
        # day's studying is done, early enough to still act on it. EventBridge
        # cron has no timezone, so this must be re-checked if the app's default
        # timezone ever stops being Asia/Seoul.
        DailyReminder:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 * * ? *)
            Name: !Sub ${AWS::StackName}-daily-reminder
            Description: Push a review reminder to learners with cards due.
            Enabled: !Equals [!Ref EnableReminders, "true"]
            Input: '{"kind": "reminder"}'

  GraphRagCodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      Policies:
        - PolicyName: InvokeDeploymentValidationHook
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-DeploymentValidationHook-*

  DeploymentValidationHook:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: infra/hooks/
      Handler: deploy_hook.handler
      Runtime: python3.12
      Timeout: 120
      Environment:
        Variables:
          NEW_VERSION: !Ref GraphRagFunction.Version
          APP_VERSION: !Ref AppVersion
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref GraphRagFunction.Version
            - Effect: Allow
              Action: codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ServerlessDeploymentApplication}/*

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Roll back when the Graph RAG Lambda reports errors during a canary.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref GraphRagFunction

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Roll back when the Graph RAG Lambda is throttled during a canary.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref GraphRagFunction

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Roll back when p95 Lambda duration approaches the timeout during a canary.
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 1
      Threshold: 110000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref GraphRagFunction

  GraphRagLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GraphRagFunction}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: Lambda Function URL pointing to the live alias
    Value: !GetAtt GraphRagFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref GraphRagFunction
  DeploymentRoleHint:
    Description: Deploy with GitHub OIDC; no long-lived AWS credentials are required.
    Value: GitHubActionsOIDC
