name: graphrag_mobile
description: GraphRAG personalized daily English learning app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  record: ^5.2.0
  file_picker: ^8.1.7
  desktop_drop: 0.7.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  characters: ^1.4.1
  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  fl_chart: ^0.69.0
  flutter_math_fork: ^0.7.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  # Dart exposes only a UTC offset and a localized abbreviation ("KST"), never an
  # IANA name — and the server needs a real zone id to compute day boundaries.
  flutter_timezone: ^4.1.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
dependency_overrides:
  record_platform_interface: 1.2.0
  record_android: 1.3.1
  record_web: 1.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled so the CANVAS and the hidden DOM input agree on glyph widths.
  #
  # On web the browser resolves a tap against a transparent DOM <textarea> laid
  # over the field and Flutter takes its selectionStart as the caret offset
  # (engine text_editing.dart listens to 'selectionchange'). With no fontFamily
  # set, the engine sent `font: ... "null", -apple-system, sans-serif` to that
  # element, so it measured Korean in the iOS system font while CanvasKit painted
  # it in a downloaded Noto fallback — different advances, different line
  # wrapping, and taps landing on the wrong character.
  #
  # web/index.html declares @font-face over these SAME files so both sides load
  # one identical font. Keep the two declarations in sync.
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.woff2
          weight: 400
        - asset: fonts/Pretendard-Bold.woff2
          weight: 700
