<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    This tag was missing entirely, so mobile browsers laid the app out at a
    desktop width and then scaled it down.

    interactive-widget=resizes-content asks the browser to shrink the layout
    viewport when the on-screen keyboard opens, which is what makes
    MediaQuery.viewInsets work on its own. Safari ignores it today — see
    lib/utils/keyboard_inset_web.dart for the visualViewport fallback that
    covers it.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="graphrag_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>graphrag_mobile</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pin the document to the layout viewport. Otherwise, when the on-screen
    keyboard opens, iOS Safari scrolls the *document* up to reveal the focused
    field (visualViewport.offsetTop > 0) — the app's top edge slides off screen
    while the bottom is still under the keyboard, and any inset we measure is
    computed against a viewport that has silently moved.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  </style>
  <script>
    // Belt to the CSS brace: if Safari scrolls the layout viewport anyway, put
    // it straight back. Cheap, and only fires while the keyboard animates.
    if (window.visualViewport) {
      var pinScroll = function () {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      };
      window.visualViewport.addEventListener('scroll', pinScroll);
      window.visualViewport.addEventListener('resize', pinScroll);
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
