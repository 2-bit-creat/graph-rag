<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    This tag was missing entirely, so mobile browsers laid the app out at a
    desktop width and then scaled it down.

    interactive-widget=resizes-content asks the browser to shrink the layout
    viewport when the on-screen keyboard opens, which is what makes
    MediaQuery.viewInsets work on its own. Safari ignores it today — see
    lib/utils/keyboard_inset_web.dart for the visualViewport fallback that
    covers it.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Turn your own diary into a knowledge graph, and study the words and sentences that come out of it.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    The standardised name above is what current browsers read. Safari before
    iOS 15.4 only honours the apple- prefixed one, and without it those versions
    open the home-screen shortcut in a normal tab with the address bar showing —
    which is the whole thing installing is meant to remove. Both must be present.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Daylog">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daylog</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pin the document to the layout viewport. Otherwise, when the on-screen
    keyboard opens, iOS Safari scrolls the *document* up to reveal the focused
    field (visualViewport.offsetTop > 0) — the app's top edge slides off screen
    while the bottom is still under the keyboard, and any inset we measure is
    computed against a viewport that has silently moved.
  -->
  <!--
    The SAME font files pubspec.yaml bundles for CanvasKit.

    Flutter web puts a transparent DOM <textarea> over each text field and the
    browser — not Flutter — decides which character a tap landed on, using that
    element's own text layout. So the element has to measure text with exactly
    the font the canvas paints with, or the caret goes to the wrong character.
    Declaring the identical files here is what makes the two agree; the browser
    fetches each URL once and serves both uses from cache.

    Keep this in sync with the `fonts:` block in pubspec.yaml.
  -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="assets/fonts/Pretendard-Regular.woff2">
  <style>
    @font-face {
      font-family: 'Pretendard';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/Pretendard-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Pretendard';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/fonts/Pretendard-Bold.woff2') format('woff2');
    }
  </style>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  </style>
  <script>
    // A CSS @font-face is only fetched once something uses it, and the hidden
    // input that measures taps is not created until a field is focused. Without
    // this the browser would measure the first taps in a fallback font — the
    // exact mismatch the bundling is meant to remove — and only get it right
    // once the font happened to arrive. Ask for it up front instead.
    if (document.fonts && document.fonts.load) {
      document.fonts.load('400 14px Pretendard');
      document.fonts.load('700 14px Pretendard');
    }
  </script>
  <script>
    // Belt to the CSS brace: if Safari scrolls the layout viewport anyway, put
    // it straight back. Cheap, and only fires while the keyboard animates.
    if (window.visualViewport) {
      var pinScroll = function () {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      };
      window.visualViewport.addEventListener('scroll', pinScroll);
      window.visualViewport.addEventListener('resize', pinScroll);
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Register the push worker alongside Flutter's own. Scope '/' so a
    // notification click can focus any page of the app. Failure is non-fatal:
    // Web Push is unavailable in private windows and on iOS below 16.4, and the
    // app must still start there.
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('push_sw.js', { scope: '/' })
          .catch(function (e) { console.warn('push worker registration failed', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
