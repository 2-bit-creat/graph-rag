name: CI and production deployment

on:
  pull_request:
    branches: [main]
    # A doc-only change still triggers the workflow if it touches any file
    # outside these patterns in the same push — paths-ignore only skips when
    # EVERY changed file matches. Keep in sync with the push trigger below.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      scope:
        description: Deployment scope
        required: true
        type: choice
        default: all
        options: [all, backend, frontend]

permissions:
  contents: read

concurrency:
  group: graph-rag-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  STACK_NAME: graph-rag-backend
  # Google OAuth WEB client id, used by both halves of the deploy: the web
  # bundle is compiled with it, and the backend accepts it as the audience of
  # incoming ID tokens. Android sends this same id as its serverClientId, so
  # one value covers every platform.
  #
  # Committed rather than kept in a repo variable because an OAuth client id is
  # public by design — it ships inside the web bundle and the APK either way.
  # The client SECRET is the part that must never appear here, and this flow
  # does not use one. Setting a `GOOGLE_WEB_CLIENT_ID` repo variable overrides
  # this, for pointing a fork at a different Google project.
  DEFAULT_GOOGLE_WEB_CLIENT_ID: 965481462188-kvbqk1lhb0hjndmv0blsgg644n5s3uai.apps.googleusercontent.com

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: graphrag
          POSTGRES_PASSWORD: graphrag
          POSTGRES_DB: graphrag_test
        options: >-
          --health-cmd "pg_isready -U graphrag -d graphrag_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secret filenames
        run: |
          tracked_secret_paths="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.deploy-secrets\.env$' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_secret_paths" ]]; then
            printf '%s\n' "$tracked_secret_paths"
            echo "A tracked secret filename is not allowed." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend and validate migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://graphrag:graphrag@127.0.0.1:5432/graphrag_test
          REDIS_URL: redis://127.0.0.1:6379/0
          OPENAI_API_KEY: ""
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/check_migrations.py
          pytest -q
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Test and build Flutter web
        working-directory: mobile
        run: |
          flutter pub get
          # Existing lint debt is reported in the log but does not block a
          # production build. Analyzer errors still return a failing exit code.
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=API_BASE_URL=https://placeholder.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.sha }}
          path: mobile/build/web
          retention-days: 1
      - uses: aws-actions/setup-sam@v2
      - name: Validate and build SAM image
        run: |
          sam validate --lint
          sam build --cached --parallel

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
      # The verify job intentionally builds with a non-routable placeholder.
      # Rebuild below once the production Function URL is known; publishing the
      # verify artifact would permanently ship placeholder.invalid to browsers.
      - uses: subosito/flutter-action@v2
        if: github.event.inputs.scope != 'backend'
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Deploy backend through SAM and CodeDeploy
        id: backend
        if: github.event.inputs.scope != 'frontend'
        env:
          APP_VERSION: ${{ github.sha }}
          CORS_ORIGINS: ${{ vars.WEB_ORIGIN }}
          MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          # The backend accepts tokens minted for this client id. Android sends
          # the WEB id as its serverClientId, so this one value covers both.
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_WEB_CLIENT_ID || env.DEFAULT_GOOGLE_WEB_CLIENT_ID }}
        run: |
          FUNCTION_NAME="$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id GraphRagFunction --query 'StackResourceDetail.PhysicalResourceId' --output text 2>/dev/null || true)"
          if [[ -n "$FUNCTION_NAME" && "$FUNCTION_NAME" != "None" ]] && aws lambda get-alias --function-name "$FUNCTION_NAME" --name live >/dev/null 2>&1; then
            ENABLE_CANARY=true
          else
            ENABLE_CANARY=false
          fi
          sam build --cached --parallel
          sam deploy --config-env github --no-confirm-changeset --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM \
            --parameter-overrides AppVersion="$APP_VERSION" EnableCanary="$ENABLE_CANARY" CorsOrigins="$CORS_ORIGINS" S3Bucket="$MEDIA_BUCKET" MediaBaseUrl="$MEDIA_BASE_URL" GoogleClientIds="$GOOGLE_CLIENT_IDS"
          API_BASE_URL="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`FunctionUrl`].OutputValue' --output text)"
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "canary_enabled=$ENABLE_CANARY" >> "$GITHUB_OUTPUT"
      - name: Publish frontend
        id: frontend
        if: github.event.inputs.scope != 'backend'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
          APP_VERSION: ${{ github.sha }}
          API_BASE_URL: ${{ steps.backend.outputs.api_base_url || vars.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || env.DEFAULT_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$API_BASE_URL"
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "API_BASE_URL must be an HTTPS URL" >&2; exit 1 ;;
          esac
          cd mobile
          flutter pub get
          flutter build web --release \n            --dart-define=API_BASE_URL="$API_BASE_URL" \n            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          cd ..
          aws s3api put-bucket-versioning --bucket "$WEB_BUCKET" --versioning-configuration Status=Enabled
          bash scripts/deploy_frontend.sh mobile/build/web
      - name: Smoke test production
        if: github.event.inputs.scope != 'backend'
        env:
          API_BASE_URL: ${{ steps.backend.outputs.api_base_url || vars.API_BASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        run: python scripts/smoke_test.py --api "$API_BASE_URL" --web "$WEB_ORIGIN" --sha "${{ github.sha }}"
      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Graph RAG deployment"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Backend canary: \`${{ steps.backend.outputs.canary_enabled || 'not-run' }}\`"
            echo "- API: ${{ steps.backend.outputs.api_base_url || vars.API_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect sanitized diagnostics
        if: failure()
        run: bash scripts/collect_deploy_diagnostics.sh deploy-diagnostics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-diagnostics-${{ github.run_id }}
          path: deploy-diagnostics
          retention-days: 14
